# AWS Amplify build spec — builds the Gen 2 backend (API Lambda + API Gateway)
# and then the Vite static site, from this single repository.
#
# The `backend` phase only runs on branches connected to an Amplify backend
# environment; `frontend` always runs.
version: 1
backend:
  phases:
    build:
      commands:
        # Node 22's native type-stripping breaks ampx CDK assembly (.js imports of .ts).
        - nvm install 20
        - nvm use 20
        - node -v
        # npm ci fails on this Amplify Gen 2 + workspaces tree (lockfile/peer skew).
        - npm install --cache .npm --prefer-offline
        # shared/dist is gitignored; backend imports @travelhub/shared types from it.
        - npm run build -w shared
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        # build:web already compiles shared, then the Vite frontend
        - npm run build:web
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      # Do not cache node_modules — stale trees cause Amplify module-resolution failures.
      - .npm/**/*
